[package]
name = "sheliak-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Renders a Sheliak render job to WAV natively, without a browser or a wasm runtime."

[dependencies]
sheliak-dsp = { path = "../dsp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sheliak-render"
path = "src/main.rs"
