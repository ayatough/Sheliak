<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sheliak — songs that live in your repository</title>
    <meta
      name="description"
      content="Write synth patches and note data in Markdown code fences; a Rust DSP core compiled to WebAssembly plays them in the browser, hot-reloading as you type."
    />
    <meta name="theme-color" content="#0a0c0b" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Absolute, because crawlers do not resolve these against the page. If the
         site ever moves off github.io, these two lines move with it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sheliak — songs that live in your repository" />
    <meta
      property="og:description"
      content="Synth patches and note data in Markdown, played by a Rust DSP core compiled to WebAssembly. The document is the whole of the state."
    />
    <meta property="og:url" content="https://ayatough.github.io/Sheliak/" />
    <meta property="og:image" content="https://ayatough.github.io/Sheliak/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="mark" src="/mark.svg" alt="" width="21" height="26" />
        <strong>Sheliak</strong>
        <span class="sub">wavetable wasm synth</span>
        <span class="dot" id="state-dot"></span>
      </div>
      <div class="transport">
        <button id="play" class="play" type="button">▶ Play</button>
        <span id="status" class="status">stopped — click Play to start audio</span>
      </div>
      <nav class="view-tabs" id="view-tabs">
        <button type="button" data-view="md">MD</button>
        <button type="button" data-view="gui" class="on">GUI</button>
      </nav>
    </header>

    <main class="layout" id="layout">
      <section class="pane editor-pane" id="pane-md">
        <div class="pane-head">
          <span>document.md</span>
          <span id="meta" class="meta"></span>
        </div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <div id="errors" class="errors" hidden></div>
      </section>

      <section class="pane side" id="pane-gui">
        <canvas id="scope" class="scope" width="640" height="120"></canvas>
        <div class="posbar"><span id="pos"></span></div>

        <div class="seq-head">
          <span class="seq-title">SEQUENCE</span>
          <label class="num">bars <input id="loop-bars" type="number" min="1" max="8" step="1" /></label>
          <label class="num">bpm <input id="loop-bpm" type="number" min="20" max="300" step="1" /></label>
          <button type="button" id="chord-mode" class="chip">chord</button>
        </div>
        <div id="seq" class="seq"></div>

        <div id="track-tabs" class="track-tabs"></div>
        <div id="params" class="params"></div>

        <div id="tracks" class="tracks"></div>

        <details class="expanded">
          <summary>Loop IR</summary>
          <pre id="loopview"></pre>
        </details>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
